name: Bug report
description: Something does not work as described
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for the report. The Companion log (Settings → Log, filter for the connection) is the most helpful thing you can attach.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Module, Companion and Designer versions
      placeholder: 'Module 1.0.0, Companion 5.0.5, Designer r34.0.3'
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Transports / playback
        - Sections, cues, jumps
        - Timecode
        - Master output
        - Machines, health, failover
        - Editor / hosts
        - Layers, sections, tags, notes
        - Variables / feedbacks
        - Presets
        - Connection / configuration
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Session setup
      description: Director / actors / understudy / editor, dedicated Director, transports and multitransports involved
  - type: textarea
    id: log
    attributes:
      label: Companion log
      description: Lines of the connection around the time of the problem
      render: text
