name: Feature request
description: Something the module should be able to do
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve
      description: The situation on the show floor, not the implementation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could it look in Companion
      description: Action, feedback, variable or tile you have in mind
  - type: input
    id: designer
    attributes:
      label: Where is it in Designer
      description: The Designer feature, menu or API this relates to (if known)
  - type: dropdown
    id: importance
    attributes:
      label: How important is it for you
      options:
        - Nice to have
        - Would use it on every show
        - Blocking – I cannot use the module without it
